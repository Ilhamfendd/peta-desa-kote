<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

.leaflet-container img.leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {

}
.leaflet-container a {

}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }

.leaflet-map-pane canvas { z-index: 100; }

.leaflet-vml-shape {

	height: 1px;
	}
.lvml {

	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {

.leaflet-right .leaflet-control {

	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;

.leaflet-grab {

.leaflet-crosshair,

.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;

.leaflet-bar a,
.leaflet-control-layers-toggle {

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:first-child {

.leaflet-bar a:last-child {

	}
.leaflet-bar a.leaflet-disabled {

.leaflet-touch .leaflet-bar a {

.leaflet-touch .leaflet-bar a:first-child {

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

.leaflet-control-layers {

.leaflet-control-layers-toggle {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-left .leaflet-control-scale {

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

.leaflet-popup-content {

	}
.leaflet-popup-content p {

	}
.leaflet-popup-tip-container {

	height: 20px;
	position: absolute;

	}
.leaflet-popup-tip {

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;

	-ms-user-select: none;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-top:before {

.leaflet-tooltip-bottom:before {

	margin-left: -6px;

	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

	margin-top: -6px;
	}

@media print {

		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;

<style>/* ═══════════════════════════════════════════════════════════
   Peta Digital Desa Kote — sistem desain
   Palet chart & chrome mengikuti palet tervalidasi (light+dark).
   ═══════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;

  /* Permukaan & tinta */
  --surface-1: #fcfcfb;
  --surface-2: #f4f3f0;
  --plane:     #f9f9f7;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --grid:      #e1e0d9;
  --axis:      #c3c2b7;
  --border:    rgba(11, 11, 11, .10);
  --border-2:  rgba(11, 11, 11, .16);
  --shadow:    0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.08);
  --shadow-sm: 0 1px 2px rgba(11,11,11,.08);
  --wash:      rgba(11,11,11,.045);

  /* Aksen — diturunkan dari hijau logo KKN #263f29 (hue 127°).
     Kontras terukur: aksen 7,86:1 di permukaan terang; teks putih 8,07:1. */
  --brand:     #263f29;
  --brand-2:   #172b1a;
  --accent:    #2a5a2f;
  --accent-in: #ffffff;
  --accent-wash: rgba(42,90,47,.10);
  --on-brand:  #ffffff;

  /* Seri kategorikal (urutan tetap — jangan diputar) */
  --series-1: #2a78d6;  --series-2: #eb6834;  --series-3: #1baf7a;  --series-4: #eda100;
  --series-5: #e87ba4;  --series-6: #008300;  --series-7: #4a3aa7;  --series-8: #e34948;

  /* Status (tidak pernah dipakai sebagai warna seri) */
  --good: #0ca30c;  --warning: #fab219;  --serious: #ec835a;  --critical: #d03b3b;
  --good-text: #006300;

  /* Peta */
  --map-bg:    #dfe7ec;
  --map-land:  #f3f1ea;
  --map-water: #c9dbe8;
  --road-1:    #6b6763;  --road-2: #8b8681;  --road-3: #a8a39c;
  --coast:     #4a80a8;
  --kabut:       #eeeee9;   /* selubung di luar batas desa */
  --kabut-legap: 0.72;

  /* Warna penanda tempat — terpisah dari palet grafik. Semuanya dipakai di
     atas cakram berbingkai putih, jadi cukup pekat agar tetap terbaca baik
     di atas citra satelit maupun peta terang. */
  --pin-pemerintahan:  #2a5a9c;
  --pin-pendidikan:    #de6a24;
  --pin-kesehatan:     #d13b3b;
  --pin-ibadah:        #1f7a3d;
  --pin-ekonomi:       #d19000;
  --pin-kuliner:       #a1601c;
  --pin-perikanan:     #c94f86;
  --pin-pertanian:     #6f9422;
  --pin-wisata:        #0e9b8f;
  --pin-penginapan:    #7b5cc7;
  --pin-sosial:        #a2529f;
  --pin-transportasi:  #4a6a86;
  --pin-air:           #1195b5;
  --pin-infrastruktur: #6b6f76;
  --pin-lainnya:       #86847d;

  --radius:    10px;
  --radius-sm: 7px;
  --sidebar-w: 384px;
  --topbar-h:  56px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --surface-2: #232322;
  --plane:     #0d0d0d;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --muted:     #898781;
  --grid:      #2c2c2a;
  --axis:      #383835;
  --border:    rgba(255,255,255,.10);
  --border-2:  rgba(255,255,255,.17);
  --shadow:    0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --wash:      rgba(255,255,255,.06);

  --brand:     #1c3320;
  --brand-2:   #0f2113;
  --accent:    #5cb767;       /* 6,99:1 di permukaan gelap */
  --accent-in: #0d1f10;
  --accent-wash: rgba(92,183,103,.15);

  --series-1: #3987e5;  --series-2: #d95926;  --series-3: #199e70;  --series-4: #c98500;
  --series-5: #d55181;  --series-6: #008300;  --series-7: #9085e9;  --series-8: #e66767;

  --good-text: #0ca30c;

  --map-bg:    #10171c;
  --map-land:  #1c1d1a;
  --map-water: #16242e;
  --road-1:    #8e8981;  --road-2: #6a6660;  --road-3: #4d4a45;
  --coast:     #5b93bd;
  --kabut:       #090909;
  --kabut-legap: 0.7;
}

/* ─────────── Dasar ─────────── */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--plane);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.28; }
p { margin: 0; }
svg { display: block; }
button { font: inherit; color: inherit; }

/* Ikon garis: satu spesifikasi untuk semua ikon UI */
svg[viewBox="0 0 24 24"] {
  width: 20px; height: 20px;
  fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
svg[viewBox="0 0 24 24"] .fill { fill: currentColor; stroke: none; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

#app { display: flex; flex-direction: column; height: 100dvh; }

/* ─────────── Topbar ─────────── */
#topbar {
  height: var(--topbar-h);
  flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px 0 12px;
  background: var(--brand);
  color: var(--on-brand);
  border-bottom: 1px solid var(--brand-2);
  position: relative; z-index: 900;
}
/* Penanda sambungan ke server pengelolaan (lihat 05-server.js) */
.server-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  font-size: 11.5px; font-weight: 550; letter-spacing: .01em;
  background: rgba(255, 255, 255, .14); color: var(--on-brand);
}
.server-status::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}
.server-status.sedang { opacity: .75; }
.server-status.buruk { background: rgba(208, 59, 59, .9); color: #fff; }
@media (max-width: 720px) { .server-status { display: none; } }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; text-decoration: none; }
/* Baru terasa bisa diklik saat memang jadi tautan ke situs desa */
a.brand[href] { border-radius: 8px; padding: 3px 6px; margin: -3px -6px; transition: background .15s; }
a.brand[href]:hover { background: var(--wash); }

/* Lambang KKN dipasang sebagai mask, jadi tintanya mengikuti currentColor.
   Tanpa dukungan mask, kotaknya dibiarkan kosong — bukan blok warna. */
.logo-kkn { flex: none; }
@supports (-webkit-mask-image: url(a)) or (mask-image: url(a)) {
  .logo-kkn {
    background: currentColor;
    -webkit-mask: var(--logo-kkn) center / contain no-repeat;
    mask: var(--logo-kkn) center / contain no-repeat;
  }
}
/* Cakram putih agar lambang tampil dengan warna aslinya — tinta hijau di
   atas putih — dan tetap terbaca pada bilah hijau tua. */
.brand-badge {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  background: #fff; border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.brand-mark { width: 29px; height: 29px; color: var(--brand); }

.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-txt strong { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand-txt small {
  font-size: 10.5px; color: var(--on-brand-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: .01em;
}

.search-wrap { position: relative; flex: 1; max-width: 440px; margin-left: auto; }
.search-ico {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--on-brand-2); pointer-events: none;
}
#q {
  width: 100%; height: 34px;
  padding: 0 32px 0 33px;
  font: inherit; font-size: 13.5px; color: var(--on-brand);
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
  transition: background .15s, border-color .15s;
  -webkit-appearance: none; appearance: none;
}
#q::-webkit-search-cancel-button { display: none; }
#q::placeholder { color: rgba(255,255,255,.58); }
#q:focus {
  background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5);
  outline: none;
}
#q:focus-visible { outline: 2px solid rgba(255,255,255,.75); outline-offset: 1px; }
#q-clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); }

#q-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  max-height: min(56vh, 420px); overflow-y: auto;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 5px; z-index: 950;
}
.qr-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 7px 9px;
  background: none; border: 0; border-radius: var(--radius-sm);
  text-align: left; cursor: pointer;
}
.qr-item:hover, .qr-item[aria-selected="true"] { background: var(--wash); }
.qr-item .qr-txt { min-width: 0; flex: 1; }
.qr-item b { display: block; font-size: 13px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qr-item small { display: block; font-size: 11.5px; color: var(--muted); }
.qr-empty { padding: 14px 10px; text-align: center; color: var(--muted); font-size: 12.5px; }

.top-actions { display: flex; gap: 2px; flex: none; }
.icon-btn {
  display: grid; place-items: center;
  width: 34px; height: 34px;
  background: none; border: 0; border-radius: var(--radius-sm);
  color: var(--ink-2); cursor: pointer;
  transition: background .13s, color .13s;
}
.icon-btn:hover { background: var(--wash); color: var(--ink); }

/* Tombol di dalam bilah merek memakai tinta terang */
#topbar .icon-btn { color: var(--on-brand-2); }
#topbar .icon-btn:hover { background: rgba(255,255,255,.14); color: var(--on-brand); }
#topbar :focus-visible { outline-color: rgba(255,255,255,.8); }
.icon-btn.tiny { width: 26px; height: 26px; }
.icon-btn.tiny svg { width: 15px; height: 15px; }

/* Ikon tema & kunci bertukar sesuai keadaan */
#btn-theme .ico-moon, :root[data-theme="dark"] #btn-theme .ico-sun { display: none; }
:root[data-theme="dark"] #btn-theme .ico-moon { display: block; }
#btn-admin .ico-unlock { display: none; }
body.admin #btn-admin .ico-lock { display: none; }
body.admin #btn-admin .ico-unlock { display: block; }
body.admin #topbar #btn-admin { background: var(--on-brand); color: var(--brand); }
body.admin #topbar #btn-admin:hover { background: var(--on-brand); color: var(--brand); }

/* ─────────── Bilah penanda data contoh ─────────── */
#demo-bar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: color-mix(in srgb, var(--warning) 20%, var(--surface-1));
  border-bottom: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  font-size: 12px; line-height: 1.45; color: var(--ink);
  position: relative; z-index: 890;
}
#demo-bar[hidden] { display: none; }
#demo-bar svg { width: 17px; height: 17px; flex: none; color: var(--serious); }
#demo-bar span { flex: 1; min-width: 0; }
#demo-bar code {
  font-family: ui-monospace, monospace; font-size: 11.5px;
  background: var(--wash); padding: 1px 5px; border-radius: 4px;
}
@media (max-width: 720px) {
  /* Di ponsel cukup inti peringatannya — sisanya memakan tinggi peta */
  #demo-bar { font-size: 11px; padding: 5px 9px; gap: 7px; line-height: 1.35; }
  #demo-bar .panjang { display: none; }
}

/* ─────────── Kerangka ─────────── */
#main { flex: 1; display: flex; min-height: 0; position: relative; }

#sidebar {
  position: relative;          /* wadah acuan bagi #detail yang menumpanginya */
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  z-index: 800;
}
.tabs {
  display: grid; grid-template-columns: repeat(6, 1fr);
  flex: none; padding: 6px 6px 0;
  border-bottom: 1px solid var(--border);
  gap: 2px;
}
.tabs button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px 8px;
  background: none; border: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  color: var(--muted); cursor: pointer;
  position: relative;
  transition: color .13s, background .13s;
}
.tabs button svg { width: 18px; height: 18px; }
.tabs button span { font-size: 10.5px; font-weight: 550; letter-spacing: -.005em; }
.tabs button:hover { color: var(--ink-2); background: var(--wash); }
.tabs button[aria-selected="true"] { color: var(--accent); }
.tabs button[aria-selected="true"]::after {
  content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px;
  height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
}
.panels { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.panel { padding: 16px 16px 40px; }
.panel[hidden] { display: none; }

/* ─────────── Peta ─────────── */
#map-wrap { flex: 1; position: relative; min-width: 0; background: var(--map-bg); }
#map { position: absolute; inset: 0; background: var(--map-bg); }
.leaflet-container { font-family: var(--font); background: var(--map-bg); }
.leaflet-control-attribution { display: none; }

/* Sorot wilayah desa: yang DI LUAR batas dibuat kelabu dan pudar, sehingga
   bagian dalam menonjol karena tetap berwarna penuh. Bila backdrop-filter
   tidak didukung, tersisa selubung warna biasa — tetap masuk akal. */

#map-tools { position: absolute; top: 12px; right: 12px; z-index: 620; }
.tool-group {
  display: flex; flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.map-btn {
  display: grid; place-items: center;
  width: 36px; height: 36px;
  background: none; border: 0; color: var(--ink-2); cursor: pointer;
  transition: background .13s, color .13s;
}
.map-btn + .map-btn { border-top: 1px solid var(--border); }
.map-btn:hover { background: var(--wash); color: var(--ink); }
.map-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-in); }

.leaflet-control-container { display: none; }   /* alat peta memakai tumpukan sendiri */
#btn-zout + .map-btn { border-top-width: 4px; border-top-color: var(--surface-2); }

#layer-panel {
  position: absolute; top: 12px; right: 56px; z-index: 630;
  width: 232px; max-height: calc(100% - 76px); overflow-y: auto;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 10px;
}
#layer-panel[hidden] { display: none; }

/* ─── Pemilih mode peta ─── */
#base-switch { position: absolute; left: 12px; bottom: 30px; z-index: 615; }

.bs-toggle {
  display: block; position: relative;
  width: 68px; padding: 0;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
}
.bs-toggle:hover { border-color: var(--border-2); }
.bs-toggle .bs-thumb { height: 52px; border-radius: 0; }
.bs-cap {
  display: flex; align-items: center; justify-content: center; gap: 1px;
  padding: 4px 3px 5px;
  font-size: 10.5px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap;
}
.bs-caret { width: 13px; height: 13px; stroke-width: 2.2; color: var(--muted); }
[data-open="true"] .bs-caret { transform: rotate(180deg); }

/* Lencana kecil di pojok gambar — penanda bahwa kotak ini bisa ditekan */
.bs-badge {
  position: absolute; right: 3px; bottom: 3px;
  width: 17px; height: 17px; border-radius: 5px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  color: var(--ink-2);
}
.bs-badge svg { width: 11px; height: 11px; stroke-width: 2; }

.bs-thumb {
  display: block; position: relative;
  width: 100%; height: 54px;
  background: var(--map-water); border-radius: 7px; overflow: hidden;
}
.bs-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bs-luring {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: var(--map-land); color: var(--coast);
}
.bs-luring svg { width: 22px; height: 22px; }

.bs-panel {
  position: absolute; left: 0; bottom: calc(100% + 8px);
  padding: 9px;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.bs-panel[hidden] { display: none; }
.bs-row { display: flex; gap: 7px; }
.bs-opt {
  width: 66px; padding: 0;
  background: none; border: 0; cursor: pointer;
}
.bs-opt .bs-thumb {
  border: 2px solid transparent;
  box-shadow: 0 0 0 1px var(--border) inset;
  transition: border-color .13s;
}
.bs-opt:hover .bs-thumb { border-color: var(--axis); }
.bs-opt[aria-pressed="true"] .bs-thumb { border-color: var(--accent); }
.bs-lab {
  display: block; margin-top: 4px;
  font-size: 11px; color: var(--ink-2); text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bs-opt[aria-pressed="true"] .bs-lab { color: var(--accent); font-weight: 600; }
.bs-sw {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
}
.bs-sw .sw-label { font-size: 12.5px; }

@media (max-width: 720px) {
  /* Posisi tegaknya diatur bersama tumpukan bawah lain, di blok responsif */
  .bs-toggle { width: 58px; }
  .bs-toggle .bs-thumb { height: 44px; }
  .bs-row { max-width: calc(100vw - 46px); overflow-x: auto; padding-bottom: 3px; }
  .bs-opt { width: 58px; flex: none; }
}

/* Kanan bawah — kiri bawah sudah dipakai pemilih mode peta */
#legend {
  position: absolute; right: 12px; bottom: 30px; z-index: 610;
  max-width: 300px; max-height: 46%; overflow-y: auto;
  background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 7px 9px;
}
#legend:empty { display: none; }
/* Dua lajur bila isinya banyak, supaya tidak menjulang setinggi peta */
#legend .legend-row {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 2px 12px; margin-top: 0;
}
#legend .legend-row span { font-size: 10.5px; gap: 5px; }
#legend .legend-row i { width: 8px; height: 8px; }

/* ─── Arah mata angin ─── */
#arah {
  position: absolute; left: 12px; top: 12px; z-index: 610;
  width: 34px; height: 38px;
  background: color-mix(in srgb, var(--surface-1) 90%, transparent);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  display: grid; place-items: center; padding: 3px;
}
#arah svg { width: 100%; height: 100%; }
#arah .jarum-u { fill: var(--ink); }
#arah .jarum-s { fill: var(--axis); }
#arah .huruf-u { font-size: 11px; font-weight: 700; fill: var(--ink); font-family: var(--font); }
#arah svg path { stroke: none; }

/* ─── Skala grafis ─── */
#skala { display: inline-flex; align-items: center; gap: 6px; }
.skala-bar {
  display: inline-block; height: 6px;
  border: 1px solid var(--ink-2); border-top: 0;
  background: linear-gradient(to right, var(--ink-2) 50%, transparent 50%);
  background-size: 50% 100%;
}
.skala-teks { font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* ─── Menu konteks ─── */
#ctx-menu {
  position: absolute; z-index: 680;
  width: 210px; padding: 5px;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#ctx-menu[hidden] { display: none; }
.ctx-head { padding: 6px 8px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.ctx-head b { display: block; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ctx-head small { display: block; margin-top: 3px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctx-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 7px 8px;
  background: none; border: 0; border-radius: var(--radius-sm);
  font-size: 12.5px; text-align: left; cursor: pointer; color: var(--ink);
}
.ctx-item:hover { background: var(--wash); }
.ctx-item svg { width: 15px; height: 15px; color: var(--muted); flex: none; }

/* ─── Hasil analisis radius ─── */
/* Kiri atas, di bawah arah mata angin — kanan atas milik tombol peta */
#radius-info {
  position: absolute; left: 12px; top: 58px; z-index: 620;
  width: 238px; max-height: calc(100% - 190px); overflow-y: auto;
  padding: 11px 12px;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#radius-info[hidden] { display: none; }
.rad-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rad-head b { flex: 1; font-size: 13px; }
#radius-info .kv > div { grid-template-columns: 52px 1fr; }
#radius-info .kv .v { line-height: 1.4; }
.rad-list { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--grid); display: flex; flex-direction: column; gap: 1px; }
.rad-item {
  display: flex; align-items: center; gap: 7px;
  width: 100%; padding: 4px 5px;
  background: none; border: 0; border-radius: 5px;
  font-size: 12px; text-align: left; cursor: pointer; color: var(--ink);
}
.rad-item:hover { background: var(--wash); }
.rad-item i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.rad-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rad-item em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* Label panjang ruas pada alat ukur */
.ruas-label {
  transform: translate(-50%, -50%);
  padding: 1px 5px; font-size: 10.5px; font-weight: 600;
  color: var(--ink); background: color-mix(in srgb, var(--surface-1) 92%, transparent);
  border: 1px solid var(--border); border-radius: 999px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* Tabel atribut — dua kelas agar menang dari aturan .modal yang ditulis belakangan */
.modal.modal-lebar { width: min(780px, 100%); }
.tabel-bungkus { overflow-x: auto; }
.tabel-atribut { font-size: 12px; min-width: 640px; }
.tabel-atribut th button {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 600;
}
.tabel-atribut th button:hover { color: var(--ink); }
.tabel-atribut tbody tr { cursor: pointer; }
.tabel-atribut tbody tr:hover td { background: var(--wash); }
.tabel-atribut td:nth-child(5), .tabel-atribut td:nth-child(6),
.tabel-atribut th:nth-child(5), .tabel-atribut th:nth-child(6) { text-align: right; font-variant-numeric: tabular-nums; }

/* Penggeser kelegapan di panel layer */
.legap { display: flex; align-items: center; gap: 7px; padding: 1px 0 7px 41px; margin-top: -3px; }
.legap input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; appearance: none;
  background: var(--axis); border-radius: 2px; cursor: pointer; }
.legap input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--surface-1); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.legap input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid var(--surface-1);
  border-radius: 50%; background: var(--accent); }
.legap span { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; width: 30px; text-align: right; }

#statusbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 605;
  display: flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  font-size: 10.5px; color: var(--muted);
  background: color-mix(in srgb, var(--surface-1) 88%, transparent);
  border-top: 1px solid var(--border);
  pointer-events: none;
}
#statusbar a { color: var(--ink-2); pointer-events: auto; }
#coords { font-variant-numeric: tabular-nums; }
#attrib { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#draw-hud {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 640;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 10px 8px 14px;
  background: var(--surface-1);
  border: 1px solid var(--border-2); border-radius: 999px;
  box-shadow: var(--shadow); font-size: 12.5px;
  max-width: calc(100% - 110px);
}
#draw-hud[hidden] { display: none; }
#draw-hud .hud-txt { color: var(--ink-2); }
#draw-hud .hud-val { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }

#toast-wrap {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 950;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
}
.toast {
  padding: 8px 14px; font-size: 12.5px;
  background: var(--ink); color: var(--plane);
  border-radius: 999px; box-shadow: var(--shadow);
  animation: toast-in .18s ease-out;
}
.toast.bad { background: var(--critical); color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

/* ─────────── Marker peta ─────────── */
.poi-pin {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50% 50% 50% 2px;
  transform: rotate(-45deg);
  box-shadow: 0 1px 3px rgba(0,0,0,.32);
  border: 2px solid var(--surface-1);
  color: #fff;
}
.poi-pin svg, .poi-pin span { transform: rotate(45deg); }
.poi-pin svg { width: 13px; height: 13px; stroke-width: 2; }
.poi-pin.on { outline: 3px solid var(--accent-wash); outline-offset: 1px; }
.village-dot {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--ink-2); white-space: nowrap;
  text-shadow: 0 0 3px var(--map-land), 0 0 3px var(--map-land), 0 0 6px var(--map-land);
  pointer-events: none;
}
.village-dot i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex: none; }
.vertex-handle {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface-1); border: 2px solid var(--accent);
  box-shadow: 0 1px 2px rgba(0,0,0,.3); cursor: move;
}
.vertex-handle.mid { width: 9px; height: 9px; opacity: .5; border-style: dashed; cursor: copy; }

.leaflet-popup-content-wrapper {
  background: var(--surface-1); color: var(--ink);
  border-radius: var(--radius); box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.leaflet-popup-content { margin: 0; width: 250px !important; font-size: 13px; line-height: 1.5; }
.leaflet-popup-tip { background: var(--surface-1); border: 1px solid var(--border); }
.leaflet-popup-close-button { color: var(--muted) !important; padding: 7px 7px 0 0 !important; }
.pop { padding: 12px 13px; }
.pop-cat { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.pop-cat i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pop h4 { font-size: 14.5px; margin-bottom: 3px; }
.pop-desc { color: var(--ink-2); font-size: 12.5px; margin-top: 5px; }
.pop img { width: 100%; border-radius: var(--radius-sm); margin-top: 8px; display: block; }
.pop-meta { margin-top: 9px; display: grid; gap: 4px; font-size: 12px; }
.pop-meta div { display: flex; gap: 7px; color: var(--ink-2); }
.pop-meta svg { width: 14px; height: 14px; flex: none; color: var(--muted); margin-top: 2px; }
.pop-act { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

/* ─────────── Komponen panel ─────────── */
.p-head { margin-bottom: 14px; }
.p-head h2 { font-size: 17px; letter-spacing: -.015em; }
.p-head p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.card {
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 13px; margin-bottom: 10px;
}
/* Judul kartu — termasuk yang bersarang di dalam kepala grafik, supaya
   seluruh sidebar memakai satu tingkat judul yang sama. */
.card > h3, .chart-head h3 {
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 9px;
}

/* Kop bermerek di Beranda */
.cover {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px;
  margin-bottom: 10px;
  background: var(--brand); color: var(--on-brand);
  border-radius: var(--radius);
}
/* Sapuan cahaya halus, meminjam bentuk matahari pada lambang */
.cover::before {
  content: ""; position: absolute; right: -34px; top: -46px;
  width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.12), transparent 68%);
  pointer-events: none;
}
.cover .logo-kkn { width: 46px; height: 46px; }
.cover-logos { display: flex; align-items: center; gap: 8px; flex: none; }
.cover-logos img {
  width: 42px; height: 42px; object-fit: contain;
  background: rgba(255,255,255,.94); border-radius: 8px; padding: 3px;
}
.cover-txt { min-width: 0; position: relative; }
.cover-txt h2 { font-size: 15px; letter-spacing: -.015em; }
.cover-txt p {
  font-size: 11.5px; color: var(--on-brand-2); margin-top: 2px; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis;
}
.cover-tag {
  display: inline-flex; align-items: center;
  margin-top: 6px; padding: 2px 8px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  background: rgba(255,255,255,.15); border-radius: 999px;
}

.kredit {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 13px; margin-top: 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-1);
}
.kredit .logo-kkn { width: 30px; height: 30px; color: var(--brand); }
:root[data-theme="dark"] .kredit .logo-kkn { color: var(--accent); }
.kredit div { min-width: 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.kredit b { display: block; color: var(--ink-2); font-size: 12px; font-weight: 600; }

/* Blok statistik — satu angka utama, sisanya baris ringkas.
   Menggantikan susunan kartu kotak yang boros tinggi. */
.stat-blok { padding: 12px 13px 4px; }
.sb-utama { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sb-label { font-size: 12px; color: var(--ink-2); }
.sb-nilai {
  font-size: 30px; font-weight: 620; letter-spacing: -.025em; line-height: 1.1;
  white-space: nowrap;
}
.sb-nilai em { font-style: normal; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

.sb-rinci { margin: 9px 0 0; }

/* Chart */
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }

.legend-row { display: flex; flex-wrap: wrap; gap: 4px 13px; margin-top: 9px; }

/* Kontrol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;

label.f { display: block; margin-bottom: 10px; }
label.f > span { display: block; font-size: 11.5px; font-weight: 550; color: var(--ink-2); margin-bottom: 4px; }

.inp {
  width: 100%; padding: 7px 9px; min-height: 34px;

}

textarea.inp { min-height: 74px; resize: vertical; line-height: 1.5; }
select.inp {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 13px center, right 8px center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 26px;
}
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.f-num { font-variant-numeric: tabular-nums; }

/* Judul kelompok isian — setara <span> di dalam label.f */
.f-judul { display: block; font-size: 11.5px; font-weight: 550; color: var(--ink-2); margin-bottom: 4px; }

.jam-baris { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }

/* Pemilih waktu bawaan perangkat: samakan tingginya dengan isian lain */
input[type="time"].inp { min-height: 34px; font-variant-numeric: tabular-nums; }
input[type="time"].inp::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }

.switch { display: flex; align-items: center; gap: 9px; padding: 5px 0; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track {
  width: 32px; height: 19px; flex: none; border-radius: 999px;
  background: var(--axis); position: relative; transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2.5px; left: 2.5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(13px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch .sw-label { font-size: 13px; flex: 1; min-width: 0; }

.list { display: flex; flex-direction: column; gap: 1px; }
.list-item {

}

.list-item .li-txt { flex: 1; min-width: 0; }

.list-item .li-txt small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-act { display: flex; gap: 1px; flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; font-size: 12px;

}
.chip i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
/* Aktif = tampilan normal, agar warna kategori tetap terbaca; yang dimatikan

.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--border-2); }

.empty-state {
  padding: 22px 16px; text-align: center;
  border: 1px dashed var(--border-2); border-radius: var(--radius);

}

.note {
  display: flex; gap: 8px; padding: 9px 11px;

  background: var(--accent-wash); border-radius: var(--radius-sm);

}

.kv { display: grid; gap: 7px; font-size: 13px; }
.kv > div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: baseline; }

.prose { font-size: 13px; line-height: 1.62; color: var(--ink-2); white-space: pre-wrap; }

/* Cuaca */
.wx-now { display: flex; align-items: center; gap: 14px; }

/* Versi ringkas di Beranda: cuaca tidak boleh mengalahkan angka penduduk */
.wx-ringkas { gap: 10px; }
.wx-ringkas .wx-ico { width: 32px; height: 32px; }

.wx-ringkas .wx-desc { margin-top: 0; flex: 1; text-align: right; font-size: 12.5px; }
.wx-ico { width: 52px; height: 52px; flex: none; color: var(--accent); }
.wx-ico svg { width: 52px; height: 52px; stroke-width: 1.4; }
.wx-temp { font-size: 38px; font-weight: 620; letter-spacing: -.03em; line-height: 1; }
.wx-desc { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.wx-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--grid); }
.wx-grid > div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.wx-grid .k { color: var(--muted); }
.wx-grid .v { font-weight: 550; font-variant-numeric: tabular-nums; }
.wx-days { display: flex; flex-direction: column; gap: 1px; }
.wx-day { display: grid; grid-template-columns: 42px 24px 1fr auto; align-items: center; gap: 9px; padding: 5px 4px; font-size: 12.5px; }
.wx-day + .wx-day { border-top: 1px solid var(--grid); }
.wx-day .d { color: var(--ink-2); }
.wx-day .i { color: var(--muted); }
.wx-day .i svg { width: 17px; height: 17px; }
.wx-day .r { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wx-day .t { font-variant-numeric: tabular-nums; font-weight: 550; }
.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--wash) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: sk 1.3s infinite; border-radius: 5px; color: transparent !important; }
@keyframes sk { to { background-position: -200% 0; } }

details.acc { border-top: 1px solid var(--border); }
details.acc > summary {
  list-style: none; cursor: pointer; padding: 11px 2px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 550;
}

  content: ""; margin-left: auto; width: 7px; height: 7px;

}

.dt-galeri { margin: 0 -4px; }

.dt-info { margin: 14px 0 0; display: grid; gap: 1px; }
.dt-info > div {

}

.fo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }

.modal-bg {

/* ─────────── Responsif ─────────── */
.only-mobile { display: none; }

@media (max-width: 900px) {
  :root { --sidebar-w: 320px; }
}

@media (max-width: 720px) {
  .only-mobile { display: grid; }
  .brand-txt small { display: none; }
  .search-wrap { max-width: none; }
  #topbar { padding: 0 8px; gap: 8px; }

  #main { flex-direction: column; }
  #map-wrap { flex: 1; min-height: 0; }
  /* Tinggi mengintip = tinggi baris tab, supaya labelnya tidak terpotong */
  :root { --intip: 58px; }
  #sidebar {
    position: absolute; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; height: 62dvh;
    border-right: 0; border-top: 1px solid var(--border);

  #statusbar { bottom: var(--intip); }

  /* Di ponsel, peta yang terlihat cuma sekitar 300 px — tumpukan tombol

  #btn-print, #btn-penuh { display: none; }

  #map-tools { top: 8px; right: 8px; }

}

}
</style>

<body>

<div id="app">

  <header id="topbar">
    <button id="btn-sidebar" class="icon-btn only-mobile" aria-label="Buka panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <!-- Jadi tautan ke situs desa hanya bila peta dibuka lewat web; saat berkasnya
         dibuka langsung dari komputer, ia tetap teks biasa. Diatur di 99-init.js -->
    <a class="brand" id="brand">
      <span class="brand-badge" aria-hidden="true"><span class="brand-mark logo-kkn"></span></span>
      <span class="brand-txt">
        <strong id="brand-name">Desa Kote</strong>
        <small id="brand-sub">Singkep Pesisir · Lingga · Kep. Riau</small>
      </span>
    </a>

    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Cari tempat, dusun, atau fasilitas…" aria-label="Cari di peta">
      <button id="q-clear" class="icon-btn tiny" hidden aria-label="Hapus pencarian">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="q-results" role="listbox" hidden></div>
    </div>

    <div class="top-actions">
      <!-- Tampil hanya bila pengelola sedang masuk; diatur di 05-server.js -->
      <span id="server-status" class="server-status" hidden></span>
      <button id="btn-theme" class="icon-btn" aria-label="Ganti tema terang/gelap" title="Tema terang/gelap">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/></svg>
      </button>
    </div>
  </header>

  <!-- Hanya tampil pada berkas contoh (meta.demo) -->
  <div id="demo-bar" hidden role="status">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.4v5M12 16.6h.01M10.3 4.2L2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/></svg>
    <span><b>Data contoh</b> — angka dan tempat di halaman ini karangan,
      <b>bukan data Desa Kote</b>.<span class="panjang"> Berkas asli yang masih kosong:
      <code>peta-desa-kote.html</code></span></span>
    <button class="btn sm" data-kosongkan-contoh>Kosongkan</button>
  </div>

  <main id="main">

    <aside id="sidebar" aria-label="Panel informasi">
      <nav class="tabs" role="tablist" aria-label="Bagian informasi">
        <button role="tab" data-tab="beranda"   aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6.2 9.6V19h11.6V9.6"/></svg><span>Beranda</span></button>
        <button role="tab" data-tab="statistik" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5V11M9.8 19.5V5.5M15.1 19.5v-6M20.4 19.5V8.5"/></svg><span>Statistik</span></button>
        <button role="tab" data-tab="tempat"    aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg><span>Tempat</span></button>
        <button role="tab" data-tab="cuaca"     aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 18.5h9.2a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8-1.3 3.9 3.9 0 0 0 1.2 8.9z"/></svg><span>Cuaca</span></button>
        <button role="tab" data-tab="wilayah"   aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5L3.8 6.8v12.7L9 17.2l6 2.3 5.2-2.3V4.5L15 6.8z"/><path d="M9 4.5v12.7M15 6.8v12.7"/></svg><span>Wilayah</span></button>
        <button role="tab" data-tab="kelola"    aria-selected="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16M4 12h16M4 16.5h16"/><circle cx="9" cy="7.5" r="1.9" class="fill"/><circle cx="15.5" cy="16.5" r="1.9" class="fill"/></svg><span>Kelola</span></button>
      </nav>

      <!-- Panel rinci sebuah tempat — menutupi panel tab saat dibuka -->
      <div id="detail" hidden aria-label="Rincian tempat"></div>

      <div class="panels">
        <section class="panel" data-panel="beranda"   role="tabpanel" aria-label="Beranda"></section>
        <section class="panel" data-panel="statistik" role="tabpanel" aria-label="Statistik" hidden></section>
        <section class="panel" data-panel="tempat"    role="tabpanel" aria-label="Tempat" hidden></section>
        <section class="panel" data-panel="cuaca"     role="tabpanel" aria-label="Cuaca" hidden></section>
        <section class="panel" data-panel="wilayah"   role="tabpanel" aria-label="Wilayah" hidden></section>
        <section class="panel" data-panel="kelola"    role="tabpanel" aria-label="Kelola data" hidden></section>
      </div>
    </aside>

    <div id="map-wrap">
      <div id="map" role="application" aria-label="Peta Desa Kote"></div>

      <div id="map-tools">
        <div class="tool-group">
          <button id="btn-zin" class="map-btn" title="Perbesar" aria-label="Perbesar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
          </button>
          <button id="btn-zout" class="map-btn" title="Perkecil" aria-label="Perkecil">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12h13"/></svg>
          </button>
          <button id="btn-layers" class="map-btn" title="Layer peta" aria-label="Layer peta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5L3 8l9 4.5L21 8z"/><path d="M3 12.4l9 4.5 9-4.5"/><path d="M3 16.6l9 4.5 9-4.5"/></svg>
          </button>
          <button id="btn-measure" class="map-btn" title="Ukur jarak & luas" aria-label="Ukur jarak dan luas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 14.8L14.8 3.6l5.6 5.6L9.2 20.4z"/><path d="M7.4 11l1.9 1.9M10.2 8.2l1.9 1.9M13 5.4l1.9 1.9"/></svg>
          </button>
          <button id="btn-locate" class="map-btn" title="Lokasi saya" aria-label="Lokasi saya">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.4"/><path d="M12 1.8v2.6M12 19.6v2.6M22.2 12h-2.6M4.4 12H1.8"/></svg>
          </button>
          <button id="btn-reset" class="map-btn" title="Kembali ke Desa Kote" aria-label="Kembali ke tampilan awal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.4h-4.4"/></svg>
          </button>
          <button id="btn-print" class="map-btn" title="Cetak / simpan PDF" aria-label="Cetak peta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.8h10V9"/><rect x="3.8" y="9" width="16.4" height="7.4" rx="1.8"/><path d="M7 14.2h10v6H7z"/></svg>
          </button>
          <button id="btn-penuh" class="map-btn" title="Layar penuh" aria-label="Layar penuh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5h-5v5M15.5 3.5h5v5M15.5 20.5h5v-5M8.5 20.5h-5v-5"/></svg>
          </button>
        </div>
      </div>

      <div id="layer-panel" hidden aria-label="Pilihan layer"></div>
      <div id="base-switch" data-open="false" aria-label="Mode peta"></div>
      <div id="legend" aria-label="Legenda"></div>

      <div id="arah" aria-hidden="true" title="Utara">
        <svg viewBox="0 0 40 44">
          <text x="20" y="11" text-anchor="middle" class="huruf-u">U</text>
          <path d="M20 14 L26.5 34 L20 29 L13.5 34 Z" class="jarum-u"/>
          <path d="M20 29 L26.5 34 L20 42 L13.5 34 Z" class="jarum-s"/>
        </svg>
      </div>

      <div id="ctx-menu" hidden role="menu" aria-label="Menu peta"></div>
      <div id="radius-info" hidden aria-label="Hasil analisis radius"></div>

      <div id="statusbar">
        <span id="skala" title="Skala peta"></span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="coords" title="Koordinat kursor">—</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="attrib"></span>
        <span id="zoom-hint" hidden></span>
      </div>
      <div id="draw-hud" hidden role="status"></div>
      <div id="toast-wrap" aria-live="polite"></div>
    </div>
  </main>
</div>

<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Foto"></div>

/* ── Utilitas DOM ─────────────────────────────────────────── */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** URL aman untuk href/src — menolak skema selain http(s), mailto, tel, data:image. */
function safeUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if (/^data:image\/(png|jpe?g|gif|webp|avif);base64,/i.test(s)) return s;
  if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s)) return 'https://' + s;
  return '';
}

function ikon(path, cls = '') {
  return `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="${path}"/></svg>`;
}

/* ── Warna: variabel CSS → nilai nyata ─────────────────────
   Atribut presentasi SVG (fill=, stroke=) dan opsi Leaflet tidak
   bisa diandalkan menerima var(); nilainya diselesaikan di sini
   dan cache dikosongkan setiap ganti tema.                     */
let _warna = {};
function cv(nama) {
  if (nama in _warna) return _warna[nama];
  const v = getComputedStyle(document.documentElement).getPropertyValue(nama).trim();
  return (_warna[nama] = v || '#888888');
}
function resetWarna() { _warna = {}; }

/** Ganti setiap var(--x) di dalam teks dengan warna nyatanya. */
const wr = s => String(s).replace(/var\((--[\w-]+)\)/g, (_, n) => cv(n));

/** Selesaikan semua nilai teks dalam objek gaya Leaflet. */
function gy(o) {
  for (const k in o) if (typeof o[k] === 'string') o[k] = wr(o[k]);
  return o;
}

/* ── Format angka & tanggal (id-ID) ───────────────────────── */
const NF = new Intl.NumberFormat('id-ID');
const NF1 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 });

const angka   = n => (n == null || n === '' || !isFinite(n)) ? null : NF.format(n);
const angka1  = n => (n == null || !isFinite(n)) ? '—' : NF1.format(n);
const angka2  = n => (n == null || !isFinite(n)) ? '—' : NF2.format(n);
const nOrNull = v => { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };

function ringkas(n) {
  if (n == null || !isFinite(n)) return '—';
  if (Math.abs(n) >= 1e9) return NF1.format(n / 1e9) + ' M';
  if (Math.abs(n) >= 1e6) return NF1.format(n / 1e6) + ' jt';
  if (Math.abs(n) >= 10000) return NF1.format(n / 1000) + ' rb';
  return NF.format(n);
}

function tanggal(iso, panjang) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('id-ID', panjang
    ? { day: 'numeric', month: 'long', year: 'numeric' }
    : { day: 'numeric', month: 'short', year: 'numeric' });
}

const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

/** Koordinat desimal → derajat-menit-detik dengan arah mata angin. */
function dms(v, sumbu) {
  const arah = sumbu === 'lat' ? (v < 0 ? 'LS' : 'LU') : (v < 0 ? 'BB' : 'BT');
  const a = Math.abs(v), d = Math.floor(a), m = Math.floor((a - d) * 60);
  const s = ((a - d - m / 60) * 3600).toFixed(1);
  return `${d}°${String(m).padStart(2, '0')}'${String(s).padStart(4, '0')}" ${arah}`;
}

/* ── Geodesi ──────────────────────────────────────────────── */
const R_BUMI = 6371008.8;
const rad = d => d * Math.PI / 180;

/** Jarak haversine (meter) antara dua [lat,lng]. */
function jarak(a, b) {
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R_BUMI * Math.asin(Math.sqrt(h));
}

function panjangJalur(pts) {
  let t = 0;
  for (let i = 1; i < pts.length; i++) t += jarak(pts[i - 1], pts[i]);
  return t;
}

/** Luas poligon bola (m²) dari cincin [lat,lng] — rumus ekses bola. */
function luasPoligon(ring) {
  if (!ring || ring.length < 3) return 0;
  let total = 0;
  for (let i = 0; i < ring.length; i++) {
    const p1 = ring[i], p2 = ring[(i + 1) % ring.length];
    total += rad(p2[1] - p1[1]) * (2 + Math.sin(rad(p1[0])) + Math.sin(rad(p2[0])));
  }
  return Math.abs(total * R_BUMI * R_BUMI / 2);
}

function teksJarak(m) {
  return m < 1000 ? `${angka1(m)} m` : `${angka2(m / 1000)} km`;
}
function teksLuas(m2) {
  if (m2 < 10000) return `${angka1(m2)} m²`;
  if (m2 < 1e6)   return `${angka2(m2 / 10000)} ha`;
  return `${angka2(m2 / 1e6)} km² <span class="dim">(${angka1(m2 / 10000)} ha)</span>`;
}

/* ── GeoJSON ⇄ Leaflet ────────────────────────────────────── */
/** Cincin GeoJSON [lng,lat] → latlng Leaflet [lat,lng]. */
const keLatLng = ring => ring.map(p => [p[1], p[0]]);
const keGeo    = pts  => pts.map(p => [+p[1].toFixed(6), +p[0].toFixed(6)]);

function poligonGeoJSON(pts, props) {
  const ring = keGeo(pts);
  if (ring.length && (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1])) {
    ring.push(ring[0].slice());
  }
  return { type: 'Feature', properties: props || {}, geometry: { type: 'Polygon', coordinates: [ring] } };
}

/** Cincin luar sebuah Feature/Polygon → latlng Leaflet. */
function cincinLuar(f) {
  const g = f && (f.geometry || f);
  if (!g) return null;
  if (g.type === 'Polygon') return keLatLng(g.coordinates[0]);
  if (g.type === 'MultiPolygon') return keLatLng(g.coordinates[0][0]);
  return null;
}

/* ── Penyimpanan ──────────────────────────────────────────── */
function bacaJSON(id) {
  const n = document.getElementById(id);
  if (!n) return null;
  const t = n.textContent.trim();
  if (!t || t.startsWith('/*')) return null;
  try { return JSON.parse(t); } catch (e) { console.warn('Data ' + id + ' rusak:', e); return null; }
}

function muatData() {
  const tertanam = bacaJSON('desa-data');

  // Berkas contoh memakai penyimpanan sendiri, supaya suntingan di sana
  // tidak pernah bocor ke berkas asli yang dipakai desa.
  if (tertanam && tertanam.meta && tertanam.meta.demo) {
    APP.demo = true;
    APP.simpanan += '/contoh';
  }

  let lokal = null;
  try {
    const raw = localStorage.getItem(APP.simpanan);
    if (raw) lokal = JSON.parse(raw);
  } catch (e) { /* localStorage diblokir atau isinya rusak — abaikan */ }

  // Versi terbit yang lebih baru mengalahkan salinan lokal yang basi.
  const waktu = d => (d && d.meta && d.meta.diperbarui) ? Date.parse(d.meta.diperbarui) || 0 : 0;
  let dipakai = lokal;
  if (!lokal || (tertanam && waktu(tertanam) > waktu(lokal))) dipakai = tertanam;

  const d = gabung(dataKosong(), dipakai || {});

  // Dulu satu tempat hanya menyimpan satu foto sebagai teks. Sekarang daftar,
  // jadi data lama dinaikkan bentuknya di sini.
  (d.tempat || []).forEach(t => {
    if (typeof t.foto === 'string') t.foto = t.foto ? [t.foto] : [];
    else if (!Array.isArray(t.foto)) t.foto = [];
  });
  return d;
}

/** Daftar foto sebuah tempat, apa pun bentuk simpanannya. */
function daftarFoto(t) {
  const f = t && t.foto;
  if (Array.isArray(f)) return f.map(safeUrl).filter(Boolean);
  const s = safeUrl(f);
  return s ? [s] : [];
}

/** Gabung dangkal-rekursif: menjaga kunci baru tetap ada saat data lama dimuat. */
function gabung(dasar, atas) {
  if (Array.isArray(atas)) return atas.slice();
  if (atas && typeof atas === 'object' && !Array.isArray(dasar) && dasar && typeof dasar === 'object') {
    const out = Object.assign({}, dasar);
    for (const k of Object.keys(atas)) out[k] = gabung(dasar[k], atas[k]);
    return out;
  }
  return atas === undefined ? dasar : atas;
}

/** Nama → potongan alamat yang enak dibaca, untuk tautan berbagi. */
function slug(s) {

    .slice(0, 60);

/** Perkecil gambar lewat canvas — foto ponsel mentah terlalu besar untuk
    ditanam ke dalam berkas HTML. Mengembalikan data URI. */
function kecilkanGambar(file, maks, jenis, kualitas) {
  return new Promise((selesai, gagal) => {
    if (!/^image\//.test(file.type)) return gagal(new Error('Berkas itu bukan gambar'));
    const fr = new FileReader();
    fr.onerror = () => gagal(new Error('Berkas gagal dibaca'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => gagal(new Error('Gambar tidak terbaca'));
      img.onload = () => {
        const s = Math.min(1, maks / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * s));
        const h = Math.max(1, Math.round(img.height * s));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        if (jenis === 'image/jpeg') { g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); }
        g.drawImage(img, 0, 0, w, h);
        try { selesai(c.toDataURL(jenis, kualitas)); }
        catch (e) { gagal(new Error('Gambar gagal diolah')); }
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}

function teksUkuran(b) {

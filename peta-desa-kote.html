/* ── Modal ────────────────────────────────────────────────── */
function bukaModal(opsi) {
  tutupModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(opsi.judul)}">
      <div class="modal-head">
        <h3>${esc(opsi.judul)}</h3>
        <button class="icon-btn" data-tutup aria-label="Tutup">${ikon('M6 6l12 12M18 6L6 18')}</button>
      </div>
      <div class="modal-body">${opsi.isi}</div>
      <div class="modal-foot">${(opsi.aksi || []).map((a, i) =>
        `<button class="btn ${a.cls || ''}" data-aksi="${i}">${esc(a.label)}</button>`).join('')}</div>
    </div>`;
  document.body.appendChild(bg);

  const tutup = () => tutupModal();
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.closest('[data-tutup]')) return tutup();
    const b = e.target.closest('[data-aksi]');
    if (!b) return;
    const a = opsi.aksi[+b.dataset.aksi];
    if (a.fn && a.fn(bg.querySelector('.modal-body')) === false) return;
    tutup();
  });
  document.addEventListener('keydown', escModal);

  const fokus = bg.querySelector('input,select,textarea,button');
  if (fokus) setTimeout(() => fokus.focus(), 40);
  return bg;
}
function escModal(e) { if (e.key === 'Escape') tutupModal(); }
function tutupModal() {
  const m = $('.modal-bg');
  if (m) m.remove();
  document.removeEventListener('keydown', escModal);
}

/* ── Mesin menggambar ─────────────────────────────────────── */
const Gambar = {
  aktif: null, pts: [], garis: null, isi: null, handles: [], cb: null, poligon: true, label: ''
};

function mulaiGambar(o) {
  batalGambar();
  Gambar.aktif = o.tipe;
  Gambar.poligon = o.poligon !== false;
  Gambar.cb = o.selesai;
  Gambar.label = o.label || 'Klik di peta untuk menambah titik';
  Gambar.pts = (o.awal || []).slice();
  S.mode = o.tipe;

  S.peta.doubleClickZoom.disable();
  S.peta.getContainer().style.cursor = 'crosshair';
  S.peta.on('click', klikGambar);
  S.peta.on('dblclick', selesaiGambar);
  document.addEventListener('keydown', tombolGambar);

  if (o.tipe === 'ukur') $('#btn-measure').setAttribute('aria-pressed', 'true');
  perbaruiGambar();
  aturLembar(false);
}

function klikGambar(e) {
  Gambar.pts.push([e.latlng.lat, e.latlng.lng]);
  perbaruiGambar();
}

function tombolGambar(e) {
  if (!Gambar.aktif) return;
  if (e.key === 'Escape') { e.preventDefault(); batalGambar(); }
  else if (e.key === 'Enter') { e.preventDefault(); selesaiGambar(); }
  else if ((e.key === 'Backspace' || e.key === 'z' && (e.ctrlKey || e.metaKey))
           && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); Gambar.pts.pop(); perbaruiGambar();
  }
}

function perbaruiGambar() {
  const g = S.lapis.sunting;
  g.clearLayers();
  Gambar.handles = [];

  const pts = Gambar.pts;
  const warna = cv(Gambar.aktif === 'ukur' ? '--series-2' : '--accent');

  if (pts.length > 1) {
    if (Gambar.poligon && pts.length > 2) {
      Gambar.isi = L.polygon(pts, { color: warna, weight: 2, fillColor: warna, fillOpacity: .12,
                                    interactive: false, pane: 'p-sunting' }).addTo(g);
    } else {
      Gambar.garis = L.polyline(pts, { color: warna, weight: 2, interactive: false, pane: 'p-sunting' }).addTo(g);
    }
    if (Gambar.aktif === 'ukur') labelRuas(pts, g);
  }

  pts.forEach((p, i) => {
    const mk = L.marker(p, {
      draggable: true, keyboard: false, pane: 'p-sunting',
      icon: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6], html: '<div class="vertex-handle"></div>' })
    }).addTo(g);
    mk.on('drag', ev => { Gambar.pts[i] = [ev.latlng.lat, ev.latlng.lng]; perbaruiGaris(); });
    mk.on('dragend', perbaruiGambar);
    mk.on('click', ev => {
      L.DomEvent.stop(ev);
      if (Gambar.pts.length > 1) { Gambar.pts.splice(i, 1); perbaruiGambar(); }
    });
    Gambar.handles.push(mk);
  });

  hudGambar();
}

/** Panjang tiap ruas ditulis di titik tengahnya — kebiasaan alat ukur GIS. */
function labelRuas(pts, g) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = jarak(a, b);
    if (d < 12) continue;
    L.marker([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], {
      interactive: false, keyboard: false, pane: 'p-sunting',
      icon: L.divIcon({ className: '', iconSize: null, html: `<div class="ruas-label">${teksJarak(d)}</div>` })
    }).addTo(g);
  }
}

function perbaruiGaris() {
  if (Gambar.isi) Gambar.isi.setLatLngs(Gambar.pts);
  if (Gambar.garis) Gambar.garis.setLatLngs(Gambar.pts);
  hudGambar();
}

function hudGambar() {
  const hud = $('#draw-hud');
  if (!Gambar.aktif) { hud.hidden = true; return; }
  const pts = Gambar.pts;
  const cukup = Gambar.poligon ? pts.length >= 3 : pts.length >= 2;

  let ukuran = '';
  if (Gambar.poligon && pts.length >= 3) {
    ukuran = `<span class="hud-val">${teksLuas(luasPoligon(pts))}</span>
              <span class="hud-txt">keliling ${teksJarak(panjangJalur(pts.concat([pts[0]])))}</span>`;
  } else if (pts.length >= 2) {
    ukuran = `<span class="hud-val">${teksJarak(panjangJalur(pts))}</span>`;
  } else {
    ukuran = `<span class="hud-txt">${esc(Gambar.label)}</span>`;
  }

  hud.hidden = false;
  hud.innerHTML = `${ukuran}
    <span class="hud-txt" style="color:var(--muted)">${pts.length} titik</span>
    <span style="display:flex;gap:5px">
      ${pts.length ? `<button class="btn sm" data-gambar-undo>Mundur</button>` : ''}
      <button class="btn sm" data-gambar-batal>Batal</button>
      ${Gambar.aktif !== 'ukur' ? `<button class="btn sm primary" data-gambar-selesai ${cukup ? '' : 'disabled'}>Selesai</button>` : ''}
    </span>`;
}

function selesaiGambar() {
  if (!Gambar.aktif || Gambar.aktif === 'ukur') return;
  const cukup = Gambar.poligon ? Gambar.pts.length >= 3 : Gambar.pts.length >= 2;
  if (!cukup) return;
  const pts = Gambar.pts.slice(), cb = Gambar.cb;
  batalGambar();
  if (cb) cb(pts);
}

function batalGambar() {
  if (!Gambar.aktif) { $('#draw-hud').hidden = true; return; }
  S.peta.off('click', klikGambar);
  S.peta.off('dblclick', selesaiGambar);
  document.removeEventListener('keydown', tombolGambar);
  S.peta.doubleClickZoom.enable();
  S.peta.getContainer().style.cursor = '';
  S.lapis.sunting.clearLayers();
  $('#btn-measure').setAttribute('aria-pressed', 'false');
  $('#draw-hud').hidden = true;
  Gambar.aktif = null; Gambar.pts = []; Gambar.cb = null; Gambar.isi = null; Gambar.garis = null;
  S.mode = null;
}

/* ── Menempatkan tempat ───────────────────────────────────── */
function modeTambahTempat(draf) {
  batalGambar();
  S.mode = 'tempat';
  S.peta.getContainer().style.cursor = 'crosshair';
  $('#draw-hud').hidden = false;
  $('#draw-hud').innerHTML = `<span class="hud-txt">${draf && draf.nama
      ? `Klik letak untuk “${esc(draf.nama)}”` : 'Klik di peta untuk menaruh tempat baru'}</span>
    <button class="btn sm" data-gambar-batal>Batal</button>`;
  aturLembar(false);

  const sekali = e => {
    S.peta.off('click', sekali);
    S.peta.getContainer().style.cursor = '';
    $('#draw-hud').hidden = true;
    S.mode = null;
    formTempat(Object.assign({}, draf || {}, { lat: e.latlng.lat, lon: e.latlng.lng }));
  };
  S.peta.on('click', sekali);
  Gambar.batalTempat = () => { S.peta.off('click', sekali); S.peta.getContainer().style.cursor = ''; S.mode = null; };
}

/* ── Jam buka: disimpan sebagai kalimat, disunting sebagai pilihan ──
   Mengetik "Senin–Jumat 08.00–15.00" itu merepotkan dan mudah salah tulis,
   jadi harinya dipilih dan jamnya memakai pemilih waktu bawaan perangkat. */
const POLA_HARI = ['Senin–Jumat', 'Senin–Sabtu', 'Setiap hari'];

function uraiJam(s) {
  s = String(s || '').trim();
  const hari = POLA_HARI.find(p => s.includes(p)) || POLA_HARI[0];
  if (!s) return { hari, buka: '', tutup: '', penuh: false };
  if (/24\s*jam/i.test(s)) return { hari, buka: '', tutup: '', penuh: true };

  const m = s.match(/(\d{1,2})[.:](\d{2})\s*[–—-]\s*(\d{1,2})[.:](\d{2})/);
  if (!m) return { hari, buka: '', tutup: '', penuh: false };
  const p2 = n => String(n).padStart(2, '0');
  return { hari, buka: `${p2(m[1])}:${m[2]}`, tutup: `${p2(m[3])}:${m[4]}`, penuh: false };
}

function susunJam(j) {
  if (j.penuh) return `${j.hari} 24 jam`;
  if (!j.buka || !j.tutup) return '';
  return `${j.hari} ${j.buka.replace(':', '.')}–${j.tutup.replace(':', '.')}`;
}

function formTempat(awal) {

  const isi = `
    <label class="f"><span>Nama tempat <b class="wajib" title="Wajib diisi">*</b></span>
      <input class="inp" name="nama" value="${esc(t.nama)}" placeholder="mis. Kantor Desa Kote"
             autocapitalize="words" autocomplete="off" enterkeyhint="next" required></label>

    <label class="f"><span>Kategori</span>
      <select class="inp" name="kategori">${opsiKat}</select></label>

    <label class="f"><span>Keterangan <em>opsional</em></span>
      <textarea class="inp" name="deskripsi" rows="2"
                placeholder="Penjelasan singkat yang membantu warga">${esc(t.deskripsi)}</textarea></label>

    <label class="f"><span>Alamat</span>
      <input class="inp" name="alamat" value="${esc(t.alamat)}" autocapitalize="words"
             placeholder="mis. Jl. Raya Kote RT 02"></label>

    <div class="f-row">

        <input class="inp" type="tel" inputmode="tel" name="kontak" value="${esc(t.kontak)}"
               placeholder="0812…" autocomplete="off"></label>
      <label class="f"><span>Situs / medsos</span>
        <input class="inp" type="url" inputmode="url" name="website" value="${esc(t.website)}"
               placeholder="https://…" autocomplete="off" spellcheck="false"></label>
    </div>

    <div class="f">
      <span class="f-judul">Jam buka</span>
      <div class="jam-baris">
        <select class="inp" name="hari">
          ${POLA_HARI.map(p => `<option ${p === j.hari ? 'selected' : ''}>${p}</option>`).join('')}
        </select>
        <label class="switch" style="padding:0">
          <input type="checkbox" name="jam24" ${j.penuh ? 'checked' : ''}>
          <span class="track"></span><span class="sw-label">24 jam</span>
        </label>
      </div>
      <div class="f-row" data-jam-waktu ${j.penuh ? 'hidden' : ''} style="margin-top:8px">
        <input class="inp" type="time" name="buka" value="${esc(j.buka)}" aria-label="Mulai buka">
        <input class="inp" type="time" name="tutup" value="${esc(j.tutup)}" aria-label="Tutup">
      </div>
      <p class="chart-note" style="margin-top:6px">Kosongkan bila jamnya tidak tentu.</p>
    </div>

    <div class="f">
      <span class="f-judul">Foto <em>opsional — dari kamera atau galeri</em></span>
      <div data-foto-kotak></div>
    </div>

    <div class="f">
      <span class="f-judul">Letak</span>
      <div class="f-row">
        <input class="inp f-num" inputmode="decimal" name="lat" value="${(+t.lat).toFixed(6)}"
               aria-label="Lintang" title="Lintang">
        <input class="inp f-num" inputmode="decimal" name="lon" value="${(+t.lon).toFixed(6)}"
               aria-label="Bujur" title="Bujur">
      </div>
      <div class="btn-row" style="margin-top:7px">
        <button type="button" class="btn sm" data-gps>
          ${ikon('M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM12 2.2v3M12 19v3M21.8 12h-3M5.2 12h-3')}
          Pakai lokasi saya</button>

    </div>`;

  }});
  aksi.push({ label: 'Batal', fn: () => {} });
  /** Baca seluruh isian jadi satu catatan; dipakai saat menyimpan maupun

  const kumpul = body => {
    const v = n => { const el = body.querySelector(`[name="${n}"]`); return el ? (el.value || '').trim() : ''; };
    const jam24 = body.querySelector('[name="jam24"]');

  };

  aksi.push({ label: baru ? 'Tambahkan' : 'Simpan', cls: 'primary', fn: body => {
    const rec = kumpul(body);
    if (!rec.nama) { body.querySelector('[name="nama"]').focus(); pesan('Nama tempat wajib diisi', true); return false; }
    if (!isFinite(rec.lat) || !isFinite(rec.lon)) { pesan('Koordinat tidak sah', true); return false; }
    rec.id = t.id || idBaru();
    const i = S.data.tempat.findIndex(x => x.id === rec.id);
    if (i >= 0) S.data.tempat[i] = rec; else S.data.tempat.push(rec);

    S.kategoriAktif.add(rec.kategori);

  const bg = bukaModal({ judul: baru ? 'Tempat baru' : 'Ubah tempat', isi, aksi });

  /* ── Bagian foto ── */
  const kotak = bg.querySelector('[data-foto-kotak]');

  const gambarKotak = () => {
    const daftar = fotoData.map((f, i) => `
      <div class="fo-item">
        <img src="${esc(safeUrl(f))}" alt="Foto ${i + 1}">
        <button type="button" class="fo-hapus" data-foto-hapus="${i}" aria-label="Hapus foto ${i + 1}">

        ${i === 0 ? '<span class="fo-utama">Utama</span>' : ''}
      </div>`).join('');

    kotak.innerHTML = `
      ${fotoData.length ? `<div class="fo-grid">${daftar}</div>` : ''}
      <button type="button" class="btn ${fotoData.length ? 'sm' : 'wide'}" data-foto-tambah>

        ${fotoData.length ? 'Tambah foto lagi' : 'Ambil foto atau pilih dari galeri'}</button>
      ${fotoData.length > 1 ? '<p class="chart-note" style="margin-top:6px">Foto pertama dipakai sebagai foto utama.</p>' : ''}`;
  };
  gambarKotak();

  const pilih = document.createElement('input');
  pilih.type = 'file';
  pilih.accept = 'image/*';
  pilih.multiple = true;                 // beberapa foto sekaligus
  pilih.style.display = 'none';
  bg.appendChild(pilih);

  pilih.addEventListener('change', () => {
    const berkas = Array.from(pilih.files || []);
    pilih.value = '';
    if (!berkas.length) return;

    kotak.innerHTML = `<p class="chart-note">Mengolah ${berkas.length} foto…</p>`;
    // 1000 px / kualitas 0,7 — cukup tajam di layar, tetap ringan saat ditanam
    Promise.all(berkas.map(f => kecilkanGambar(f, 1000, 'image/jpeg', 0.7).catch(() => null)))
      .then(hasil => {
        const sah = hasil.filter(Boolean);
        fotoData = fotoData.concat(sah);
        gambarKotak();
        const gagal = hasil.length - sah.length;
        const besar = sah.reduce((s, d) => s + d.length * 0.75, 0);
        pesan(`${sah.length} foto ditambahkan (${teksUkuran(Math.round(besar))})`
              + (gagal ? ` · ${gagal} gagal dibaca` : ''), !!gagal);
      });
  });

  kotak.addEventListener('click', e => {
    const hapus = e.target.closest('[data-foto-hapus]');
    if (hapus) { e.preventDefault(); fotoData.splice(+hapus.dataset.fotoHapus, 1); gambarKotak(); }
    else if (e.target.closest('[data-foto-tambah]')) { e.preventDefault(); pilih.click(); }
  });

  /* ── Jam buka: sembunyikan pemilih waktu saat "24 jam" ── */
  const badan = bg.querySelector('.modal-body');
  badan.addEventListener('change', e => {
    if (e.target.name === 'jam24') badan.querySelector('[data-jam-waktu]').hidden = e.target.checked;
  });

  /* ── Letak: ambil dari GPS atau tunjuk langsung di peta ── */
  badan.addEventListener('click', e => {
    if (e.target.closest('[data-gps]')) {
      e.preventDefault();
      if (!navigator.geolocation) return pesan('Perangkat tidak mendukung lokasi', true);
      pesan('Mencari lokasi…');
      navigator.geolocation.getCurrentPosition(
        p => {
          badan.querySelector('[name="lat"]').value = p.coords.latitude.toFixed(6);
          badan.querySelector('[name="lon"]').value = p.coords.longitude.toFixed(6);
          pesan(`Lokasi terpasang (ketelitian ± ${angka1(p.coords.accuracy)} m)`);
        },
        () => pesan('Lokasi tidak bisa diakses — izinkan lewat pengaturan browser', true),
        { enableHighAccuracy: true, timeout: 10000 });
    } else if (e.target.closest('[data-pilih-peta]')) {
      e.preventDefault();
      const draf = kumpul(badan);          // isian dibawa serta, tidak hilang
      tutupModal();
      modeTambahTempat(draf);
    }
  });
}

/* ── Impor geometri (GeoJSON / KML) ───────────────────────── */
function parseKML(teks) {
  const doc = new DOMParser().parseFromString(teks, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('KML tidak terbaca');
  const fitur = [];

  doc.querySelectorAll('Placemark').forEach(pm => {
    const nama = (pm.querySelector('name') || {}).textContent || '';
    const poly = pm.querySelector('Polygon outerBoundaryIs coordinates') || pm.querySelector('Polygon coordinates');
    const titik = pm.querySelector('Point coordinates');

    const urai = t => String(t).trim().split(/\s+/).map(s => {
      const [x, y] = s.split(',').map(Number);
      return [x, y];
    }).filter(p => isFinite(p[0]) && isFinite(p[1]));

    if (poly) {
      const ring = urai(poly.textContent);
      if (ring.length >= 3) fitur.push({ type: 'Feature', properties: { nama }, geometry: { type: 'Polygon', coordinates: [ring] } });
    } else if (titik) {
      const p = urai(titik.textContent)[0];
      if (p) fitur.push({ type: 'Feature', properties: { nama }, geometry: { type: 'Point', coordinates: p } });
    }
  });
  return { type: 'FeatureCollection', features: fitur };
}

function imporGeometri(file, tujuan) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const teks = String(fr.result);
      const fc = /^\s*</.test(teks) ? parseKML(teks) : JSON.parse(teks);
      const fitur = fc.type === 'FeatureCollection' ? fc.features : [fc];
      const poligon = fitur.filter(f => f.geometry && /Polygon$/.test(f.geometry.type));
      const titik = fitur.filter(f => f.geometry && f.geometry.type === 'Point');

      if (tujuan === 'batas') {
        if (!poligon.length) return pesan('Berkas tidak memuat poligon', true);
        S.data.batas.desa = poligon[0];
        simpan(); gambarBatas(); buatPanelLapis(); fokusAwal(); gambarUlang();
        pesan('Batas desa dimuat dari berkas');
      } else if (tujuan === 'dusun') {
        if (!poligon.length) return pesan('Berkas tidak memuat poligon', true);
        poligon.forEach((f, i) => S.data.batas.dusun.push({
          nama: (f.properties && (f.properties.nama || f.properties.name)) || `Dusun ${S.data.batas.dusun.length + 1}`,
          geo: f
        }));
        simpan(); gambarBatas(); buatPanelLapis(); gambarUlang();
        pesan(`${poligon.length} dusun dimuat`);
      } else if (tujuan === 'tempat') {
        if (!titik.length) return pesan('Berkas tidak memuat titik', true);
        titik.forEach(f => {
          const p = f.properties || {};
          S.data.tempat.push({
            id: idBaru(),
            nama: p.nama || p.name || 'Tanpa nama',
            kategori: KATEGORI[p.kategori] ? p.kategori : 'lainnya',
            deskripsi: p.deskripsi || p.description || '',
            alamat: p.alamat || '', kontak: p.kontak || '', jam: '', website: '', foto: '',
            lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0]
          });
        });
        simpan(); gambarTempat(); buatPanelLapis(); gambarUlang();
        pesan(`${titik.length} tempat dimuat`);
      }
    } catch (e) {
      pesan('Berkas gagal dibaca — pastikan GeoJSON atau KML yang sah', true);
    }
  };
  fr.readAsText(file);
}

function unduh(nama, isi, tipe) {
  const b = new Blob([isi], { type: (tipe || 'text/plain') + ';charset=utf-8' });
  const u = URL.createObjectURL(b);

/* ── Impor ────────────────────────────────────────────────────
   Ekspor HTML mandiri, cadangan JSON, dan ekspor GeoJSON sudah dicabut dari
   sini: data tidak lagi hidup di browser, jadi menyalinnya dari layar cuma
   membuat salinan yang bercabang. Penggantinya:
     · cadangan penuh   -> node cadangkan.mjs

/* ── Impor CSV ────────────────────────────────────────────────
   Menerima berkas hasil ekspor aplikasi ini maupun keluaran
   `ambil-tempat.py`. Pemisah, kutip, dan BOM ditangani sendiri —
   tidak memakai pustaka luar. */

function tebakPemisah(teks) {
  const baris = (teks.split(/\r?\n/)[0] || '');
  const hitung = s => (baris.match(new RegExp('\\' + s, 'g')) || []).length;
  const tab = (baris.match(/\t/g) || []).length;
  if (tab > hitung(';') && tab > hitung(',')) return '\t';
  return hitung(';') >= hitung(',') ? ';' : ',';
}

/** Pengurai CSV yang menghormati tanda kutip, kutip ganda, dan baris
    baru di dalam sel. */
function uraiCSV(teks) {
  teks = String(teks).replace(/^﻿/, '');
  const pemisah = tebakPemisah(teks);
  const baris = [];
  let sel = '', deret = [], dalamKutip = false;

  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (dalamKutip) {
      if (c === '"') {
        if (teks[i + 1] === '"') { sel += '"'; i++; }
        else dalamKutip = false;
      } else sel += c;
    } else if (c === '"') {
      dalamKutip = true;
    } else if (c === pemisah) {
      deret.push(sel); sel = '';
    } else if (c === '\n') {
      deret.push(sel); baris.push(deret); deret = []; sel = '';
    } else if (c !== '\r') {
      sel += c;
    }
  }
  if (sel !== '' || deret.length) { deret.push(sel); baris.push(deret); }
  return baris.filter(r => r.some(v => String(v).trim() !== ''));
}

/* Nama kolom yang dikenali → medan internal */
const KOLOM_CSV = {
  nama: 'nama', name: 'nama', 'nama tempat': 'nama',
  kategori: 'kategori', category: 'kategori', jenis: 'kategori',
  alamat: 'alamat', address: 'alamat',
  kontak: 'kontak', telepon: 'kontak', phone: 'kontak', 'no hp': 'kontak', hp: 'kontak',
  jam: 'jam', 'jam buka': 'jam', 'opening hours': 'jam',
  website: 'website', situs: 'website', web: 'website',
  keterangan: 'deskripsi', deskripsi: 'deskripsi', description: 'deskripsi', catatan: 'deskripsi',
  lintang: 'lat', latitude: 'lat', lat: 'lat', y: 'lat',
  bujur: 'lon', longitude: 'lon', lon: 'lon', lng: 'lon', long: 'lon', x: 'lon'
};

/** Terima id kategori ("ekonomi") maupun labelnya ("Ekonomi & UMKM"). */
function cocokkanKategori(nilai) {
  const v = String(nilai || '').trim().toLowerCase();
  if (!v) return 'lainnya';
  if (KATEGORI[v]) return v;
  const lewatLabel = Object.keys(KATEGORI).find(k => KATEGORI[k].label.toLowerCase() === v);
  if (lewatLabel) return lewatLabel;
  const sebagian = Object.keys(KATEGORI).find(k =>
    KATEGORI[k].label.toLowerCase().split(/[&/]/)[0].trim() === v);
  return sebagian || 'lainnya';
}

/** Angka bisa memakai titik atau koma desimal. */
function angkaKoordinat(v) {
  const s = String(v || '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  // "104,506733" -> desimal koma; "1.234,5" tidak dipakai untuk koordinat
  const n = parseFloat(s.indexOf(',') >= 0 && s.indexOf('.') < 0 ? s.replace(',', '.') : s);
  return n;
}

function bacaTempatCSV(teks) {
  const baris = uraiCSV(teks);
  if (baris.length < 2) return { galat: 'Berkas tidak memuat baris data.' };

  const kepala = baris[0].map(h => KOLOM_CSV[String(h).trim().toLowerCase().replace(/\s+/g, ' ')] || null);
  if (kepala.indexOf('nama') < 0 || kepala.indexOf('lat') < 0 || kepala.indexOf('lon') < 0) {
    return { galat: 'Kolom wajib tidak ditemukan. Berkas harus memuat Nama, Lintang, dan Bujur.' };
  }

  const sah = [], bermasalah = [];
  baris.slice(1).forEach((r, i) => {
    const o = {};
    kepala.forEach((medan, k) => { if (medan) o[medan] = String(r[k] == null ? '' : r[k]).trim(); });

    const lat = angkaKoordinat(o.lat), lon = angkaKoordinat(o.lon);
    const alasan = !o.nama ? 'nama kosong'
                 : (!isFinite(lat) || !isFinite(lon)) ? 'koordinat tidak terbaca'
                 : (Math.abs(lat) > 90 || Math.abs(lon) > 180) ? 'koordinat di luar jangkauan'
                 : null;
    if (alasan) { bermasalah.push({ baris: i + 2, nama: o.nama || '(tanpa nama)', alasan }); return; }

    sah.push({
      id: idBaru(), nama: o.nama, kategori: cocokkanKategori(o.kategori),
      deskripsi: o.deskripsi || '', alamat: o.alamat || '', kontak: o.kontak || '',
      jam: o.jam || '', website: o.website || '', foto: [],
      lat: +lat.toFixed(6), lon: +lon.toFixed(6)
    });
  });

  return { sah, bermasalah };
}

function imporCSV(file) {
  const fr = new FileReader();
  fr.onerror = () => pesan('Berkas gagal dibaca', true);
  fr.onload = () => {
    const hasil = bacaTempatCSV(String(fr.result));
    if (hasil.galat) return pesan(hasil.galat, true);
    if (!hasil.sah.length) return pesan('Tidak ada baris yang bisa dipakai', true);
    dialogImporCSV(hasil);
  };
  fr.readAsText(file, 'utf-8');
}

function dialogImporCSV(hasil) {
  const { sah, bermasalah } = hasil;

  // Anggap sama bila namanya sama dan jaraknya di bawah 40 m
  const kembar = sah.filter(b => S.data.tempat.some(t =>
    t.nama.trim().toLowerCase() === b.nama.trim().toLowerCase()
    && jarak([t.lat, t.lon], [b.lat, b.lon]) < 40));

  const hitung = {};
  sah.forEach(b => { hitung[b.kategori] = (hitung[b.kategori] || 0) + 1; });
  const rincian = Object.entries(hitung).sort((a, b) => b[1] - a[1]).map(([k, n]) => {
    const d = KATEGORI[k] || KATEGORI.lainnya;
    return `<span><i style="background:var(${d.warna})"></i>${esc(d.label)} ${n}</span>`;
  }).join('');

  const luarJangkauan = sah.filter(b => !batasPeta().contains([b.lat, b.lon])).length;

  bukaModal({
    judul: 'Muat tempat dari CSV',
    isi: `
      <div class="kv" style="font-size:13px">
        <div><span class="k">Siap dimuat</span><span class="v"><b>${sah.length}</b> tempat</span></div>
        ${kembar.length ? `<div><span class="k">Sudah ada</span><span class="v">${kembar.length} bernama sama di lokasi yang sama</span></div>` : ''}
        ${bermasalah.length ? `<div><span class="k">Dilewati</span><span class="v">${bermasalah.length} baris bermasalah</span></div>` : ''}
        ${luarJangkauan ? `<div><span class="k">Di luar peta</span><span class="v">${luarJangkauan} titik</span></div>` : ''}
      </div>
      <div class="legend-row" style="margin-top:11px">${rincian}</div>

      ${bermasalah.length ? `<details class="acc" style="margin-top:12px"><summary>Lihat baris bermasalah</summary>
        <div class="acc-body"><table class="dt"><thead><tr><th>Baris</th><th>Nama</th><th>Sebab</th></tr></thead>
        <tbody>${bermasalah.slice(0, 12).map(b =>
          `<tr><td>${b.baris}</td><td>${esc(b.nama)}</td><td style="text-align:left">${esc(b.alasan)}</td></tr>`).join('')}
        </tbody></table>${bermasalah.length > 12 ? `<p class="chart-note">…dan ${bermasalah.length - 12} lagi</p>` : ''}</div>
      </details>` : ''}

      ${luarJangkauan ? `<div class="note warn" style="margin-top:12px">
        ${ikon('M12 8.4v5M12 16.6h.01M10.3 4.2L2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z')}
        <span>${luarJangkauan} titik berada di luar jangkauan peta desa. Tetap dimuat, tetapi
        naikkan <b>Jangkauan peta</b> bila ingin melihatnya.</span></div>` : ''}

      <label class="switch" style="margin-top:12px">
        <input type="checkbox" name="lewati" ${kembar.length ? 'checked' : ''} ${kembar.length ? '' : 'disabled'}>
        <span class="track"></span>

      </label>

        <span class="track"></span>
        <span class="sw-label">Ganti seluruh daftar<small>Hapus ${S.data.tempat.length} tempat yang ada sekarang</small></span>
      </label>`,
    aksi: [
      { label: 'Batal', fn: () => {} },
      { label: 'Muat', cls: 'primary', fn: body => {
        const lewati = body.querySelector('[name="lewati"]').checked;
        const ganti = body.querySelector('[name="ganti"]').checked;

        let masuk = sah;
        if (ganti) S.data.tempat = [];
        else if (lewati) {
          const adaKembar = b => S.data.tempat.some(t =>
            t.nama.trim().toLowerCase() === b.nama.trim().toLowerCase()
            && jarak([t.lat, t.lon], [b.lat, b.lon]) < 40);
          masuk = sah.filter(b => !adaKembar(b));
        }

        S.data.tempat = S.data.tempat.concat(masuk);
        S.kategoriAktif = new Set(Object.keys(KATEGORI));
        simpan(); gambarTempat(); buatPanelLapis(); gambarUlang();
        pesan(`${masuk.length} tempat dimuat dari CSV`);
      }}
    ]
  });
}

/* ── Berbagi & kode QR ────────────────────────────────────── */

/** Alamat dasar peta: alamat terbit bila sudah diisi, kalau tidak alamat berkas ini. */
function alamatDasar() {
  return safeUrl(S.data.profil.urlPublik) || location.href.replace(/[#?].*$/, '');
}

function tautanTempat(t) {
  return alamatDasar() + '#t=' + (slug(t.nama) || t.id);
}

/** Buka tempat yang ditunjuk alamat, mis. …/peta.html#t=kantor-desa-kote */
function bukaDariHash() {
  const h = decodeURIComponent(String(location.hash || '').replace(/^#/, ''));
  const m = h.match(/^t=(.+)$/i);
  if (!m) return;
  const kunci = m[1].toLowerCase();
  const t = S.data.tempat.find(x => x.id === m[1])
         || S.data.tempat.find(x => slug(x.nama) === kunci);
  if (t) setTimeout(() => sorotTempat(t.id), 400);
}

function modalBagikan(t) {
  const tautan = t ? tautanTempat(t) : alamatDasar();
  const judul = t ? t.nama : `Peta Digital ${S.data.meta.nama}`;
  const svg = qrSVG(tautan, { ukuran: 190 });
  const lokal = /^file:/i.test(tautan);

  bukaModal({
    judul: 'Bagikan',
    isi: `
      <p style="font-size:13px;font-weight:550;margin-bottom:9px">${esc(judul)}</p>
      ${svg ? `<div style="display:grid;place-items:center;padding:10px;background:#fff;border-radius:var(--radius);border:1px solid var(--border)">${svg}</div>`
            : `<p class="chart-note">Alamatnya terlalu panjang untuk dijadikan kode QR.</p>`}
      <label class="f" style="margin-top:11px"><span>Tautan</span>
        <input class="inp" id="tautan-bagi" readonly value="${esc(tautan)}"
               style="font-size:12px" onclick="this.select()"></label>
      ${lokal ? `<div class="note warn">
          ${ikon('M12 20.5a8.5 8.5 0 1 0 0-17 8.5 8.5 0 0 0 0 17zM12 11v5.2M12 7.9h.01')}
          <span>Ini alamat berkas di komputer Anda, jadi belum bisa dibuka orang lain.
          Isi <b>alamat peta di website desa</b> pada tab Kelola supaya tautan dan kode QR-nya bisa dipakai umum.</span>
        </div>` : ''}`,
    aksi: [
      { label: 'Unduh QR', fn: () => {
        const png = qrPNG(tautan, 900);
        if (!png) return pesan('Kode QR gagal dibuat', true);
        const a = document.createElement('a');
        a.href = png; a.download = `qr-${slug(judul) || 'peta'}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        pesan('Kode QR diunduh');
        return false;                       // biarkan jendela tetap terbuka
      }},
      { label: 'Salin tautan', cls: 'primary', fn: body => {
        const inp = body.querySelector('#tautan-bagi');
        inp.select();
        if (navigator.share) {
          navigator.share({ title: judul, url: tautan }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(tautan).then(() => pesan('Tautan disalin'), () => pesan('Gagal menyalin', true));
        } else {
          document.execCommand('copy'); pesan('Tautan disalin');
        }
      }}
    ]
  });
}

/* ── Tema ─────────────────────────────────────────────────── */
function terapkanTema(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(APP.simpanan + '/tema', t); } catch (e) {}
  resetWarna();

  if (S.peta) {
    ['perairan', 'pantai', 'jalan', 'pulau', 'tetangga'].forEach(id => S.lapis[id].clearLayers());
    gambarVektor();

  }

}

function temaAwal() {
  let t = null;
  try { t = localStorage.getItem(APP.simpanan + '/tema'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
}

/* ── Mode kelola ──────────────────────────────────────────────
   Dulu dibuka lewat tombol gembok di kanan atas. Sekarang tidak ada tombolnya:
   menyunting hanya mungkin bila pengelola sedang masuk lewat /admin, sebab data
   desa disimpan di server. Pengunjung biasa tidak pernah melihat tab Kelola. */
function aturModeKelola(aktif) {
  S.admin = !!aktif;
  document.body.classList.toggle('admin', S.admin);

  const tab = document.querySelector('[data-tab="kelola"]');
  if (tab) tab.hidden = !S.admin;

  if (!S.admin) {
    batalGambar();
    if (Gambar.batalTempat) Gambar.batalTempat();
    if (S.tabAktif === 'kelola') pilihTab('beranda', false);
  }
  gambarUlang();
}

/* ── Pencarian ────────────────────────────────────────────── */
function cari(kata) {
  const k = kata.trim().toLowerCase();
  if (k.length < 1) return [];
  const hasil = [];

  S.data.tempat.forEach(t => {
    const skor = cocok(k, [t.nama, t.alamat, t.deskripsi, (KATEGORI[t.kategori] || {}).label]);
    if (skor) hasil.push({ skor, jenis: 'tempat', label: t.nama || 'Tanpa nama',
                           sub: (KATEGORI[t.kategori] || KATEGORI.lainnya).label, id: t.id, kategori: t.kategori });
  });

  (S.data.batas.dusun || []).forEach((d, i) => {
    const skor = cocok(k, [d.nama]);
    if (skor) hasil.push({ skor, jenis: 'dusun', label: d.nama, sub: 'Dusun / RW', idx: i });
  });

  if (S.basemap && S.basemap.places) {
    S.basemap.places.features.forEach(f => {
      const skor = cocok(k, [f.properties.n]);
      if (skor) hasil.push({ skor: skor - .2, jenis: 'osm', label: f.properties.n,
                             sub: f.properties.k === 'village' ? 'Desa sekitar' : 'Pulau',
                             ll: [f.geometry.coordinates[1], f.geometry.coordinates[0]] });
    });
  }

  return hasil.sort((a, b) => b.skor - a.skor).slice(0, 12);
}

function cocok(k, medan) {
  let best = 0;
  medan.forEach(m => {
    if (!m) return;
    const s = String(m).toLowerCase();
    if (s === k) best = Math.max(best, 3);
    else if (s.startsWith(k)) best = Math.max(best, 2.4);
    else if (s.includes(k)) best = Math.max(best, 1.6);
  });
  return best;
}

function gambarHasilCari(kata) {
  const box = $('#q-results');
  const hasil = cari(kata);
  $('#q-clear').hidden = !kata;

  if (!kata) { box.hidden = true; box.innerHTML = ''; return; }
  if (!hasil.length) {
    box.hidden = false;
    box.innerHTML = `<div class="qr-empty">Tidak ada yang cocok dengan “${esc(kata)}”</div>`;
    return;
  }

  box.hidden = false;
  box.innerHTML = hasil.map((h, i) => {
    const d = h.jenis === 'tempat' ? (KATEGORI[h.kategori] || KATEGORI.lainnya) : null;
    const bulat = d
      ? `<span class="li-ico" style="background:var(${d.warna});width:24px;height:24px">${ikon(d.ikon)}</span>`
      : `<span class="li-ico" style="background:var(--axis);width:24px;height:24px">${ikon('M12 20.6s6.8-6.1 6.8-10.6a6.8 6.8 0 1 0-13.6 0c0 4.5 6.8 10.6 6.8 10.6z')}</span>`;
    return `<button class="qr-item" data-hasil="${i}" role="option">${bulat}
      <span class="qr-txt"><b>${esc(h.label)}</b><small>${esc(h.sub)}</small></span></button>`;
  }).join('');

  box._hasil = hasil;
}

function bukaHasil(h) {
  $('#q').value = '';
  $('#q-results').hidden = true;
  $('#q-clear').hidden = true;
  if (h.jenis === 'tempat') return bukaDetailTempat(h.id);
  else if (h.jenis === 'dusun') zoomDusun(h.idx);
  else if (h.ll) S.peta.setView(h.ll, 14, { animate: true });
  aturLembar(false);
}

function zoomDusun(i) {
  const d = S.data.batas.dusun[i];
  const r = d && d.geo && cincinLuar(d.geo);
  if (r && r.length > 2) S.peta.fitBounds(L.latLngBounds(r), { padding: [40, 40] });
  aturLembar(false);
}

/* ── Interaksi global ─────────────────────────────────────── */
function pasangInteraksi() {

  /* Tab */
  $$('.tabs button').forEach(b => b.addEventListener('click', () => pilihTab(b.dataset.tab)));

  /* Topbar */
  $('#btn-theme').addEventListener('click', () =>
    terapkanTema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#btn-sidebar').addEventListener('click', () =>
    aturLembar(!document.body.classList.contains('sheet-open')));

  /* Alat peta */
  $('#btn-layers').addEventListener('click', () => {
    const p = $('#layer-panel');
    p.hidden = !p.hidden;
    $('#btn-layers').setAttribute('aria-pressed', String(!p.hidden));
  });
  $('#btn-zin').addEventListener('click', () => S.peta.zoomIn());
  $('#btn-zout').addEventListener('click', () => S.peta.zoomOut());
  $('#btn-reset').addEventListener('click', fokusAwal);
  $('#btn-print').addEventListener('click', () => window.print());
  $('#btn-measure').addEventListener('click', () => {
    if (Gambar.aktif === 'ukur') batalGambar();
    else mulaiGambar({ tipe: 'ukur', poligon: true, label: 'Klik untuk mengukur jarak & luas' });
  });
  $('#btn-locate').addEventListener('click', () => {
    if (!navigator.geolocation) return pesan('Perangkat tidak mendukung lokasi', true);
    pesan('Mencari lokasi…');
    navigator.geolocation.getCurrentPosition(
      p => {
        const ll = [p.coords.latitude, p.coords.longitude];
        S.peta.setView(ll, 16);
        L.circleMarker(ll, gy({ radius: 7, color: 'var(--surface-1)', weight: 3,
                                fillColor: 'var(--accent)', fillOpacity: 1 }))
          .bindTooltip('Lokasi Anda').addTo(S.lapis.sunting);
      },
      () => pesan('Lokasi tidak bisa diakses — izinkan lewat pengaturan browser', true),
      { enableHighAccuracy: true, timeout: 10000 });
  });

  /* Pencarian */
  const q = $('#q');
  q.addEventListener('input', () => gambarHasilCari(q.value));
  q.addEventListener('focus', () => { if (q.value) gambarHasilCari(q.value); });
  $('#q-clear').addEventListener('click', () => { q.value = ''; gambarHasilCari(''); q.focus(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape') { q.value = ''; gambarHasilCari(''); q.blur(); }
    if (e.key === 'Enter') {
      const box = $('#q-results');
      if (box._hasil && box._hasil.length) bukaHasil(box._hasil[0]);
    }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) $('#q-results').hidden = true;
    if (!e.target.closest('#layer-panel') && !e.target.closest('#btn-layers')) {
      $('#layer-panel').hidden = true;
      $('#btn-layers').setAttribute('aria-pressed', 'false');
    }
    if (!e.target.closest('#base-switch')) bukaPemilih(false);
  });

  /* Panel layer */
  $('#layer-panel').addEventListener('change', e => {
    if (e.target.matches('[data-fokus]')) return alihFokus(e.target.checked);
    const c = e.target.closest('[data-lapis]');
    if (!c) return;
    alihLapis(c.dataset.lapis, c.checked);
    gambarLegenda();
    buatPanelLapis();
    $('#layer-panel').hidden = false;
  });
  $('#layer-panel').addEventListener('input', e => {
    const r = e.target.closest('[data-legap]');
    if (!r) return;
    setKelegapan(r.dataset.legap, +r.value);
    const label = r.parentElement.querySelector('span');
    if (label) label.textContent = Math.round(r.value * 100) + '%';
  });

  /* Perkakas GIS */
  $('#btn-penuh').addEventListener('click', alihLayarPenuh);
  document.addEventListener('fullscreenchange', () => {
    $('#btn-penuh').setAttribute('aria-pressed', String(!!document.fullscreenElement));
    if (S.peta) setTimeout(() => { S.peta.invalidateSize(); perbaruiSkala(); }, 120);
  });
  $('#ctx-menu').addEventListener('click', e => {
    const b = e.target.closest('[data-ctx]');
    if (b) aksiMenuKonteks(b.dataset.ctx);
  });
  /* Pemilih mode peta */
  const bs = $('#base-switch');
  bs.addEventListener('click', e => {
    if (e.target.closest('.bs-toggle')) return bukaPemilih(bs.dataset.open !== 'true');
    const o = e.target.closest('[data-dasar]');
    if (o) {
      bukaPemilih(false);
      gantiDasar(o.dataset.dasar);
    }
  });
  bs.addEventListener('change', e => {
    if (e.target.matches('[data-label-tempat]')) alihLabel(e.target.checked);
  });

  /* Klik terdelegasi untuk seluruh aplikasi */
  document.addEventListener('click', aksiKlik);

  /* Isian terdelegasi */
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-set-batas]')) {
      const km = Math.min(60, Math.max(1, nOrNull(t.value) || APP.jangkauan));
      setJalur(S.data, t.dataset.setBatas, km);
      terapkanBatasPeta();
      simpanTertunda();
    } else if (t.matches('[data-set]')) {
      setJalur(S.data, t.dataset.set, nOrNull(t.value));
      simpanTertunda();
    } else if (t.matches('[data-set-teks]')) {
      setJalur(S.data, t.dataset.setTeks, t.value);
      simpanTertunda();
      if (t.dataset.setTeks === 'meta.nama') $('#brand-name').textContent = t.value || 'Desa';
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-impor]') && t.files[0]) { imporGeometri(t.files[0], t.dataset.impor); t.value = ''; }
    if (t.matches('[data-impor-csv]') && t.files[0]) { imporCSV(t.files[0]); t.value = ''; }
    if (t.matches('[data-logo-desa]') && t.files[0]) { muatLogoDesa(t.files[0]); t.value = ''; }
  });

  /* Aksesibilitas papan tik untuk baris daftar */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const li = e.target.closest && e.target.closest('.list-item[role="button"]');
    if (li) { e.preventDefault(); li.click(); }
  });

  /* Tutup lembar bawah saat peta digeser di ponsel */
  window.addEventListener('resize', () => { if (S.peta) S.peta.invalidateSize(); });
}

function aksiKlik(e) {
  const T = s => e.target.closest(s);
  let n;

  if ((n = T('[data-tab-ke]')))        return pilihTab(n.dataset.tabKe);
  // Tanpa sesi pengelola, isian datanya ada di halaman pengelolaan, bukan di sini.
  if (T('[data-buka-kelola]'))         return S.admin ? pilihTab('kelola') : (location.href = '/admin');

  if ((n = T('[data-hasil]'))) {
    const h = $('#q-results')._hasil[+n.dataset.hasil];
    return bukaHasil(h);
  }

  if ((n = T('[data-kategori]'))) {
    const k = n.dataset.kategori;
    if (S.kategoriAktif.has(k)) S.kategoriAktif.delete(k); else S.kategoriAktif.add(k);
    gambarTempat(); gambarUlang('tempat');
    return;
  }

  /* Tombol di dalam baris daftar harus diperiksa LEBIH DULU daripada barisnya.
     closest() menelusuri ke atas, jadi klik tombol hapus juga cocok dengan
     baris pembungkusnya — kalau barisnya diperiksa duluan, tombolnya mati. */
  if ((n = T('[data-edit-tempat]'))) {
    e.stopPropagation();
    const t = S.data.tempat.find(x => x.id === n.dataset.editTempat);
    if (t) formTempat(t);
    return;
  }
  if ((n = T('[data-hapus-tempat]'))) {
    e.stopPropagation();
    const t = S.data.tempat.find(x => x.id === n.dataset.hapusTempat);
    if (!t) return;
    return konfirmasi(`Hapus “${t.nama}”?`, 'Tempat ini akan dihapus dari peta.', () => {
      S.data.tempat = S.data.tempat.filter(x => x.id !== t.id);
      simpan(); gambarTempat(); buatPanelLapis(); gambarUlang();
    });
  }
  if ((n = T('[data-hapus-dusun]'))) {
    e.stopPropagation();
    const i = +n.dataset.hapusDusun;
    const d = S.data.batas.dusun[i];
    if (!d) return;
    return konfirmasi(`Hapus “${d.nama || 'dusun ini'}”?`, 'Geometri dusun ini akan dihapus dari peta.', () => {
      S.data.batas.dusun.splice(i, 1);
      simpan(); gambarBatas(); buatPanelLapis(); gambarUlang();
      pesan('Dusun dihapus');
    });
  }
  if ((n = T('[data-ubah-dusun]'))) {
    e.stopPropagation();
    return gambarUlangDusun(+n.dataset.ubahDusun);
  }

  /* Rincian tempat & foto */
  if (T('[data-detail-tutup]'))         return tutupDetail();
  if ((n = T('[data-foto-pilih]')))     return pilihFoto(+n.dataset.fotoPilih);
  if ((n = T('[data-foto-besar]'))) {
    const t = S.data.tempat.find(x => x.id === S.detailAktif);
    return bukaLightbox(daftarFoto(t), +n.dataset.fotoBesar);
  }
  if (T('[data-lb-tutup]'))             return tutupLightbox();
  if ((n = T('[data-lb-geser]')))       return geserLightbox(+n.dataset.lbGeser);
  if (e.target.id === 'lightbox')       return tutupLightbox();

  if ((n = T('[data-detail-tempat]'))) return bukaDetailTempat(n.dataset.detailTempat);
  if ((n = T('[data-ke-tempat]')))     { tutupDetail(); aturLembar(false); return sorotTempat(n.dataset.keTempat); }
  if ((n = T('[data-ke-dusun]')))      return zoomDusun(+n.dataset.keDusun);
  if (T('[data-tambah-tempat]'))       return modeTambahTempat();
  if ((n = T('[data-ke-koord]'))) {
    const [la, lo] = n.dataset.keKoord.split(',').map(Number);
    S.peta.setView([la, lo], 14, { animate: true });
    aturLembar(false);
    return;
  }

  if (T('[data-muat-usulan]'))         return muatUsulanBatas();
  if (T('[data-gambar-batas]'))        return gambarBatasDesa();
  if (T('[data-gambar-dusun]'))        return gambarDusunBaru();
  if (T('[data-zoom-batas]'))          return fokusAwal();
  if (T('[data-hapus-batas]')) {
    return konfirmasi('Hapus batas desa?', 'Poligon batas akan dihapus dari peta.', () => {
      S.data.batas.desa = null;
      simpan(); gambarBatas(); buatPanelLapis(); gambarUlang();
    });
  }

  if (T('[data-gambar-undo]'))         { Gambar.pts.pop(); return perbaruiGambar(); }
  if (T('[data-gambar-batal]'))        { if (Gambar.batalTempat) Gambar.batalTempat(); $('#draw-hud').hidden = true; return batalGambar(); }
  if (T('[data-gambar-selesai]'))      return selesaiGambar();

  if (T('[data-muat-cuaca]'))          { S.cuaca = null; gambarUlang('cuaca'); return ambilCuaca(true); }

  if (T('[data-kosongkan-contoh]')) {
    return konfirmasi('Kosongkan data contoh?',
      'Seluruh angka dan tempat karangan di berkas ini dihapus, sehingga tampilannya sama dengan berkas asli. Berkas asli sendiri tidak tersentuh.', () => {
        try { localStorage.removeItem(APP.simpanan); } catch (err) {}
        S.data = gabung(dataKosong(), { meta: { demo: true } });
        simpan(true);
        gambarBatas(); gambarTempat(); buatPanelLapis(); fokusAwal(); gambarUlang();
        pesan('Data contoh dikosongkan');
      });
  }
  if (T('[data-tutup-radius]'))         return hapusRadius();
  if (T('[data-tabel-atribut]'))        return modalTabelAtribut();

  if ((n = T('[data-bagi]'))) {
    const t = S.data.tempat.find(x => x.id === n.dataset.bagi);
    if (t) modalBagikan(t);
    return;
  }

  if ((n = T('[data-rute]'))) {
    const t = S.data.tempat.find(x => x.id === n.dataset.rute);
    if (t) window.open(`https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lon}`, '_blank', 'noopener');
    return;
  }

  if ((n = T('[data-tambah-baris]'))) {
    const k = n.dataset.tambahBaris;
    S.data.statistik[k].baris.push(k === 'usia' ? { l: '', lk: null, pr: null } : { l: '', v: null });
    simpan(true); gambarUlang();
    return;
  }
  if ((n = T('[data-hapus-baris]'))) {
    const [k, i] = n.dataset.hapusBaris.split('.');
    S.data.statistik[k].baris.splice(+i, 1);
    simpan(true); gambarUlang();
    return;
  }

  if (T('[data-hapus-logo]')) {
    S.data.meta.logoDesa = '';
    simpan(); gambarUlang();
    return;
  }

  if (T('[data-ekspor-csv]'))          return eksporCSV();
}

function konfirmasi(judul, teks, fn) {
  bukaModal({
    judul,
    isi: `<p style="font-size:13px;line-height:1.6;color:var(--ink-2)">${esc(teks)}</p>`,
    aksi: [{ label: 'Batal', fn: () => {} }, { label: 'Ya, lanjutkan', cls: 'danger', fn }]
  });
}

/* ── Pemuatan awal ────────────────────────────────────────── */
function mulai() {
  temaAwal();
  S.data = muatData();
  S.basemap = bacaJSON('basemap-data') || {};

  $('#brand-name').textContent = S.data.meta.nama;
  $('#brand-sub').textContent = `${S.data.meta.kecamatan} · ${S.data.meta.kabupaten} · ${S.data.meta.provinsi}`;
  document.title = `Peta Digital ${S.data.meta.nama} — ${S.data.meta.kecamatan}, ${S.data.meta.kabupaten}`;

  // Peta ini juga dipasang di /peta pada situs desa. Bila dibuka lewat web,
  // merek di kiri atas menjadi jalan pulang ke halaman profil desa; bila
  // berkasnya dibuka langsung dari komputer, ia dibiarkan sebagai teks biasa.
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    const merek = $('#brand');
    merek.href = '/';
    merek.title = `Buka situs ${S.data.meta.nama}`;
  }

  siapkanTooltip();
  buatPeta();
  pasangInteraksi();
  pilihTab('beranda', false);   // di ponsel, peta dulu yang terlihat

  if (S.data.meta.demo) {
    $('#demo-bar').hidden = false;
    // Bilah ini memakan tinggi setelah peta dibuat — beri tahu Leaflet.
    if (S.peta) setTimeout(() => { S.peta.invalidateSize({ animate: false }); gambarFokus(); }, 60);
  }

  S.bukaKelola = new URLSearchParams(location.search).get('kelola') === '1';

  bukaDariHash();
  addEventListener('hashchange', bukaDariHash);

  ambilCuaca(false);
  setInterval(() => ambilCuaca(true), 30 * 60 * 1000);

  sambungkanPengelola();
}

// Dijalankan di latar belakang, sesudah peta tampil. Kalau ditunggu lebih dulu,
// pengunjung biasa ikut menunggu jaringan padahal tidak butuh apa pun dari server.
async function sambungkanPengelola() {
  if (!await sambungServer()) return;
  tandaServer('siap');

  aturModeKelola(true);          // sesi ada -> boleh menyunting

  const draf = await muatDrafServer();
  if (!draf) return;

  // Draf di server adalah kebenaran bersama; salinan di perangkat ini bisa saja
  // tertinggal karena orang lain menyunting dari komputer lain.
  S.data = gabung(dataKosong(), draf.data);
  (S.data.tempat || []).forEach(t => {
    if (typeof t.foto === 'string') t.foto = t.foto ? [t.foto] : [];
    else if (!Array.isArray(t.foto)) t.foto = [];
  });

  $('#brand-name').textContent = S.data.meta.nama;
  gambarBatas(); gambarTempat(); buatPanelLapis(); gambarFokus(); gambarUlang();
  if (S.bukaKelola) pilihTab('kelola');
  pesan(`Data draf dimuat${draf.meta && draf.meta.oleh ? ' — terakhir diubah ' + draf.meta.oleh : ''}`);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
else mulai();
</script>
